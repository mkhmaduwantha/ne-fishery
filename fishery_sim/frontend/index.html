<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fishery Norm Entrepreneurship Simulation</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: {
              900: '#0a0f1e',
              800: '#0d1526',
              700: '#111d35',
              600: '#162444',
            }
          },
          fontFamily: {
            mono: ['JetBrains Mono', 'Fira Code', 'Consolas', 'monospace'],
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { background-color: #0a0f1e; font-family: 'JetBrains Mono', monospace; }
    .pulse-red { animation: pulse-red 1.5s ease-in-out infinite; }
    @keyframes pulse-red {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .scrollbar-thin::-webkit-scrollbar { width: 4px; }
    .scrollbar-thin::-webkit-scrollbar-track { background: #0d1526; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: #1e3a5f; border-radius: 2px; }
    .agent-dot { transition: all 0.3s ease; cursor: pointer; }
    .agent-dot:hover { transform: scale(1.2); }
    .norm-glow { box-shadow: 0 0 8px rgba(20, 184, 166, 0.6); }
  </style>
</head>
<body class="text-gray-200 min-h-screen">
  <div id="root"></div>

  <!-- React + Babel for JSX transpilation in browser -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide icons via CDN -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <script type="text/babel" src="/App.jsx"></script>
</body>
</html>
